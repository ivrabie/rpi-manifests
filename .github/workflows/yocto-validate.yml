name: yocto-validate

on:
  pull_request:
    paths:
      - "kas/**"
      - ".github/workflows/yocto-*.yml"
  push:
    branches:
      - main
    paths:
      - "kas/**"
      - ".github/workflows/yocto-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yocto-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc
          docker system prune -af || true
          df -h

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential chrpath cpio debianutils diffstat file gawk gcc \
            git iputils-ping libegl1-mesa libsdl1.2-dev lz4 python3 \
            python3-git python3-jinja2 python3-pip python3-pexpect socat \
            texinfo unzip wget xterm xz-utils zstd

      - name: Install kas
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user kas
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kas --version

      - name: Ensure user namespaces are available
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          sysctl kernel.unprivileged_userns_clone || true

      - name: Prepare Yocto cache directories
        run: mkdir -p build/downloads build/sstate-cache

      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: build/downloads
          key: yocto-dl-${{ runner.os }}-scarthgap-rpi4-${{ hashFiles('kas/base.yml', 'kas/rpi-scarthgap.yml') }}-validate-${{ github.run_id }}
          restore-keys: |
            yocto-dl-${{ runner.os }}-scarthgap-rpi4-${{ hashFiles('kas/base.yml', 'kas/rpi-scarthgap.yml') }}-

      - name: Restore sstate cache
        uses: actions/cache/restore@v4
        with:
          path: build/sstate-cache
          key: yocto-sstate-${{ runner.os }}-scarthgap-rpi4-${{ hashFiles('kas/base.yml', 'kas/rpi-scarthgap.yml') }}-validate-${{ github.run_id }}
          restore-keys: |
            yocto-sstate-${{ runner.os }}-scarthgap-rpi4-${{ hashFiles('kas/base.yml', 'kas/rpi-scarthgap.yml') }}-

      - name: Checkout Yocto layers with kas
        run: kas checkout kas/rpi-scarthgap.yml

      - name: Validate active layers
        run: kas shell kas/rpi-scarthgap.yml -c "bitbake-layers show-layers"

      - name: Parse metadata only
        run: kas shell kas/rpi-scarthgap.yml -c "bitbake -p"
